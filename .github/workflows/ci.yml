name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Server — install, typecheck, test, build
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Client — install, typecheck, build
        working-directory: client
        run: |
          npm ci
          npm run typecheck
          npm run build
